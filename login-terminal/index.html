<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="term" id="term">
    <div class="chrome">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">root@access — bash</span>
    </div>
    <div class="screen" id="screen">
      <p class="line">$ auth --interactive</p>
      <p class="line dim">Awaiting credentials…</p>
    </div>
    <form id="loginForm" class="form" autocomplete="on">
      <label>user<span class="prompt">$</span>
        <input type="text" name="username" id="username" required autocomplete="username" spellcheck="false" />
      </label>
      <label>pass<span class="prompt">$</span>
        <input type="password" name="password" id="password" required autocomplete="current-password" />
      </label>
      <button type="submit">./login</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
