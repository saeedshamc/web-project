<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment · Filmstrip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="darkroom">
    <h1>Comment Reel</h1>
    <div class="strip" id="strip" aria-live="polite"></div>
    <form id="commentForm">
      <input type="text" id="name" required placeholder="Director" maxlength="20" />
      <textarea id="comment" rows="2" required placeholder="Scene notes…" maxlength="140"></textarea>
      <button type="submit">Add Frame</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
