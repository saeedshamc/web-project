<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment · Comic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>POW! Comments</h1>
    <div class="panels" id="panels"></div>
    <form id="commentForm">
      <input type="text" id="name" required placeholder="Hero name" maxlength="18" />
      <textarea id="comment" rows="2" required placeholder="Your speech bubble…" maxlength="120"></textarea>
      <button type="submit">KAPOW</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
