<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP · Pad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="lock">
    <h1>Enter code</h1>
    <p class="lede">Demo code: <strong>4821</strong></p>
    <div class="slots" id="slots">
      <input maxlength="1" inputmode="numeric" aria-label="Digit 1" />
      <input maxlength="1" inputmode="numeric" aria-label="Digit 2" />
      <input maxlength="1" inputmode="numeric" aria-label="Digit 3" />
      <input maxlength="1" inputmode="numeric" aria-label="Digit 4" />
    </div>
    <div class="pad" id="pad">
      <button type="button" data-n="1">1</button>
      <button type="button" data-n="2">2</button>
      <button type="button" data-n="3">3</button>
      <button type="button" data-n="4">4</button>
      <button type="button" data-n="5">5</button>
      <button type="button" data-n="6">6</button>
      <button type="button" data-n="7">7</button>
      <button type="button" data-n="8">8</button>
      <button type="button" data-n="9">9</button>
      <button type="button" data-n="clear" class="ghost">⌫</button>
      <button type="button" data-n="0">0</button>
      <button type="button" data-n="ok" class="ok">OK</button>
    </div>
    <p class="status" id="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
