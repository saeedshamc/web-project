<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment · Guestbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Lora:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="book" id="book">
    <div class="page left" id="leftPage">
      <h1>Guestbook</h1>
      <p class="intro">Sign your name. Turn the page to read others.</p>
      <form id="commentForm">
        <label>
          <span>Guest</span>
          <input type="text" id="name" required maxlength="28" placeholder="Your name" />
        </label>
        <label>
          <span>Words</span>
          <textarea id="comment" rows="4" required maxlength="180" placeholder="Leave a kind note…"></textarea>
        </label>
        <button type="submit">Sign the book</button>
      </form>
    </div>

    <div class="page right" id="rightPage">
      <h2>Entries</h2>
      <div class="entries" id="entries"></div>
      <div class="pager">
        <button type="button" id="prev" aria-label="Previous page">‹</button>
        <span id="pageLabel">1 / 1</span>
        <button type="button" id="next" aria-label="Next page">›</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
