<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter · Balloon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="sky">
    <div class="balloon" id="balloon" aria-hidden="true">
      <div class="envelope"></div>
      <div class="basket"></div>
    </div>
    <form id="newsForm">
      <h1>Rise with us</h1>
      <p class="lede">Subscribe — the balloon lifts off.</p>
      <input type="email" id="email" required placeholder="you@sky.com" />
      <button type="submit">Launch Balloon</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
