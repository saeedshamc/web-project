<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="rig">
    <div class="radio">
      <div class="speaker"></div>
      <div class="tuner">
        <div class="needle" id="needle"></div>
        <div class="scale"></div>
      </div>
      <div class="knobs">
        <button type="button" class="knob" id="tune" aria-label="Tune frequency">TUN</button>
        <div class="freq" id="freq">98.7 FM</div>
        <div class="light" id="light"></div>
      </div>
    </div>
    <form id="contactForm">
      <h1>Transmit Message</h1>
      <label>
        <span>Call sign</span>
        <input type="text" name="name" required placeholder="WX-41" />
      </label>
      <label>
        <span>Reply frequency (email)</span>
        <input type="email" name="email" required />
      </label>
      <label>
        <span>Transmission</span>
        <textarea name="message" rows="3" required></textarea>
      </label>
      <button type="submit">Broadcast</button>
    </form>
    <p class="hint" id="hint">Tune the dial, then broadcast your message.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
